<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ほどく">
  <title>ほどく</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app">
    <section id="homeScreen" class="screen active">
      <canvas class="star-canvas" aria-hidden="true"></canvas>
      <button class="icon-button settings-button" id="openSettingsButton" aria-label="設定">⚙︎</button>

      <div class="hero">
        <p class="eyebrow">HODOKU</p>
        <h1 class="soft-font">ほどく</h1>
        <p class="subtitle">一日の緊張を、眠る前にほどく。</p>
      </div>

      <div class="course-list" role="radiogroup" aria-label="コース">
        <button class="course-card" data-course="03min" role="radio" aria-checked="false">
          <span class="course-time">3分</span>
          <strong class="soft-font">今すぐほどく</strong>
          <small>疲れ切った夜に</small>
        </button>

        <button class="course-card selected" data-course="07min" role="radio" aria-checked="true">
          <span class="badge">おすすめ</span>
          <span class="course-time">7分</span>
          <strong class="soft-font">一日の緊張をほどく</strong>
          <small>普段使いの標準コース</small>
        </button>

        <button class="course-card" data-course="12min" role="radio" aria-checked="false">
          <span class="course-time">12分</span>
          <strong class="soft-font">深くほどく</strong>
          <small>ゆっくり眠りに向かう夜に</small>
        </button>
      </div>

      <button class="primary-button" id="goToPreparationButton">始める</button>
    </section>

    <section id="preparationScreen" class="screen preparation-screen">
      <canvas class="star-canvas" aria-hidden="true"></canvas>
      <header class="screen-header">
        <button class="back-button" id="backToHomeButton">‹ 戻る</button>
        <h2 class="soft-font">準備</h2>
      </header>

      <div class="summary-card compact-course-summary" aria-label="選択中のコース">
        <p id="selectedCourseTime" class="summary-time soft-font">7分</p>
        <h3 id="selectedCourseTitle" class="visually-hidden">一日の緊張をほどく</h3>
      </div>

      <div class="setting-group preparation-card bgm-card">
        <label for="bgmSelect">BGM</label>
        <select id="bgmSelect">
          <option value="quiet-rain">静かな雨</option>
          <option value="midnight-ambient">深夜のアンビエント</option>
          <option value="none">BGMなし</option>
        </select>

        <label class="nested-setting-label" for="bgmVolume">BGM音量 <output id="bgmVolumeValue">25%</output></label>
        <input id="bgmVolume" type="range" min="0" max="100" value="25">

        <button class="secondary-button compact-preview-button" id="previewBgmButton">BGMを試聴</button>
      </div>

      <div class="setting-group preparation-card">
        <label for="guideVolume">ガイダンス音量 <output id="guideVolumeValue">80%</output></label>
        <input id="guideVolume" type="range" min="0" max="100" value="80">
      </div>

      <div class="setting-group preparation-card">
        <label for="afterBgmMinutes">ガイダンス終了後のBGM</label>
        <div class="number-stepper">
          <button type="button" id="afterBgmMinus" class="stepper-button" aria-label="1分減らす">−</button>
          <div class="number-input-wrap">
            <input id="afterBgmMinutes" type="number" min="0" max="120" step="1" inputmode="numeric" value="10">
            <span>分</span>
          </div>
          <button type="button" id="afterBgmPlus" class="stepper-button" aria-label="1分増やす">＋</button>
        </div>
      </div>

      <button class="primary-button" id="startSessionButton">開始</button>
    </section>

    <section id="sessionScreen" class="screen session-screen">
      <div class="session-content">
        <p id="sessionPhase" class="session-phase">ガイダンス中</p>
        <h2 id="sessionText" class="soft-font">ゆっくり、力を抜いていきます。</h2>
        <p id="sessionElapsed" class="session-time">00:00</p>
        <div class="breathing-orb" aria-hidden="true"></div>
      </div>

      <div class="session-controls">
        <button class="secondary-button" id="pauseButton">一時停止</button>
        <button class="text-button danger" id="stopButton">終了する</button>
      </div>
    </section>

    <section id="completionScreen" class="screen completion-screen">
      <div class="completion-content">
        <p class="eyebrow">SESSION COMPLETE</p>
        <h2>今日の分は、ここまでです。</h2>
        <p>眠れなくても大丈夫です。<br>今は、身体を休ませるだけで十分です。</p>
      </div>
      <button class="primary-button" id="returnHomeButton">ホームへ戻る</button>
    </section>




    <div id="settingsModal" class="modal-backdrop" hidden>
      <section class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
        <header class="modal-header">
          <h2 id="settingsModalTitle">設定</h2>
          <button type="button" class="modal-close-button" id="closeSettingsButton" aria-label="設定を閉じる">×</button>
        </header>

        <div class="modal-body">
          <div class="modal-setting-row">
            <div>
              <strong>画面ロックを防ぐ</strong>
              <small>音声の再生中は画面を点灯したままにします。</small>
            </div>
            <label class="switch">
              <input id="wakeLockEnabled" type="checkbox" checked>
              <span class="switch-slider"></span>
            </label>
          </div>

          <div class="modal-setting-row">
            <div>
              <strong>再生画面を暗くする</strong>
              <small>操作ボタンを目立たなくし、光を抑えます。</small>
            </div>
            <label class="switch">
              <input id="darkSessionEnabled" type="checkbox" checked>
              <span class="switch-slider"></span>
            </label>
          </div>

          <div class="modal-note">
            <p>音声はAIによって生成されています。</p>
            <p>設定はこの端末内に保存されます。</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <audio id="guideAudio" preload="auto"></audio>
  <audio id="bgmAudio" preload="auto"></audio>

  <script src="./app.js" defer></script>
</body>
</html>
